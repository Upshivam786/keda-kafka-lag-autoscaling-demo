apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-consumer
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: demo-consumer
  template:
    metadata:
      labels:
        app: demo-consumer
    spec:
      terminationGracePeriodSeconds: 30

      containers:
        - name: demo-consumer
          image: keda-kafka-consumer:dev
          imagePullPolicy: IfNotPresent

          env:
            - name: KAFKA_BROKERS
              value: my-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092
            - name: KAFKA_TOPIC
              value: demo-topic
            - name: KAFKA_CONSUMER_GROUP
              value: demo-consumer-group
            - name: PROCESSING_DELAY_MS
              value: "3000"
            - name: HTTP_PORT
              value: "8080"

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
